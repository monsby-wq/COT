    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --az-bronze: #CE8550;
            --az-orange: #ED813C;
            --az-teal: #0E859F;
            --az-blue: #0E5DF0;
            --az-navy: #0B192C;
        }
        .hidden { display: none !important; }
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 8% 18%, rgba(237, 129, 60, 0.08) 0%, transparent 42%),
                        radial-gradient(circle at 14% 85%, rgba(14, 133, 159, 0.10) 0%, transparent 48%),
                        #F8FAFC;
            transition: background 0.25s ease, color 0.25s ease;
        }
        #loading-screen { background: rgba(11, 25, 44, 0.92); z-index: 9999; }
        .sidebar-collapsed { width: 4.5rem !important; padding-left: 0.5rem !important; padding-right: 0.5rem !important; align-items: center; }
        .sidebar-collapsed .sidebar-text { display: none !important; }
        .sidebar-collapsed .sidebar-header { justify-content: center !important; }

        /* Gradientes corporativos AlphaZero */
        .az-gradient-text {
            background: linear-gradient(90deg, #ED813C 0%, #CE8550 35%, #0E859F 75%, #0E5DF0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .az-gradient-btn {
            background: linear-gradient(90deg, #0E859F 0%, #0E5DF0 100%);
            border: none !important;
        }
        .az-gradient-btn:hover {
            background: linear-gradient(90deg, #0b6e84 0%, #0b4cc4 100%);
        }
        .az-orange-btn {
            background: linear-gradient(90deg, #ED813C 0%, #CE8550 100%);
            border: none !important;
        }
        .az-orange-btn:hover {
            background: linear-gradient(90deg, #d96e2b 0%, #b87341 100%);
        }

        /* DISEÑO 100% TRANSPARENTE Y SIN BORDES EN EL ÁREA DE TRABAJO */
        .az-card,
        .az-transparent-box,
        .az-login-card,
        .az-top-border,
        #lista-partidas,
        #lista-catalogo,
        #lista-cuentas,
        #lista-vendedores,
        #lista-incluye-temp,
        #lista-notas-temp,
        #panel-incluye,
        #panel-notas-partida,
        #app-container .border,
        #app-container .border-2,
        #app-container .border-b,
        #app-container .border-b-2,
        #app-container .border-t,
        #app-container .border-r,
        #app-container .border-l-4,
        #login-container .border {
            background: transparent !important;
            background-color: transparent !important;
            border: none !important;
            border-image: none !important;
            box-shadow: none !important;
        }

        /* ZONAS DRAG & DROP PARA FORMATOS WORD (.DOCX) */
        .az-dropzone {
            background-color: rgba(14, 133, 159, 0.045);
            border: 2px dashed rgba(14, 133, 159, 0.38);
            border-radius: 0.85rem;
            padding: 1.25rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .az-dropzone:hover {
            background-color: rgba(14, 133, 159, 0.09);
            border-color: #0E859F;
        }
        .az-dropzone.drag-over {
            background-color: rgba(14, 93, 240, 0.13);
            border-color: #0E5DF0;
            transform: scale(1.01);
        }
        .az-dropzone.has-file {
            background-color: rgba(16, 185, 129, 0.08);
            border-color: #10B981;
            border-style: solid;
        }

        /* BLOQUES DE EMPRESA (US FIRE / USIICSA) EN CONFIGURACIÓN INICIAL */
        .az-empresa-row {
            background-color: rgba(14, 133, 159, 0.035);
            border-radius: 0.85rem;
            padding: 0.65rem 0.75rem;
            transition: all 0.2s ease;
            opacity: 0.62;
            cursor: pointer;
        }
        .az-empresa-row:hover {
            opacity: 0.90;
        }
        .az-empresa-row.activa-usfire {
            background-color: rgba(237, 129, 60, 0.10);
            opacity: 1;
            box-shadow: inset 3.5px 0 0 #ED813C;
        }
        .az-empresa-row.activa-usiicsa {
            background-color: rgba(14, 133, 159, 0.10);
            opacity: 1;
            box-shadow: inset 3.5px 0 0 #0E859F;
        }

        /* BARRA LATERAL ESTILO APPLE LIQUID GLASS */
        #sidebar {
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.52) 0%,
                rgba(240, 248, 255, 0.28) 45%,
                rgba(14, 133, 159, 0.14) 85%,
                rgba(237, 129, 60, 0.10) 100%
            ) !important;
            backdrop-filter: blur(28px) saturate(200%) brightness(1.04) !important;
            -webkit-backdrop-filter: blur(28px) saturate(200%) brightness(1.04) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.75) !important;
            box-shadow:
                inset 1.5px 1.5px 1px rgba(255, 255, 255, 0.85),
                inset -1px -1px 1px rgba(14, 133, 159, 0.18),
                12px 0 36px -8px rgba(11, 25, 44, 0.08) !important;
        }

        /* Botones interactivos dentro del Liquid Glass */
        .liquid-nav-btn {
            color: #0B192C;
            border-radius: 0.85rem;
            transition: all 0.22s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .liquid-nav-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.68) 0%, rgba(255, 255, 255, 0.32) 100%) !important;
            box-shadow:
                inset 1px 1px 0.5px rgba(255, 255, 255, 0.95),
                0 4px 14px -3px rgba(14, 133, 159, 0.16) !important;
            transform: translateY(-1px);
        }
        .liquid-icon-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.28) 100%) !important;
            box-shadow:
                inset 1px 1px 0.5px rgba(255, 255, 255, 0.9),
                0 2px 10px -2px rgba(11, 25, 44, 0.10) !important;
            color: #0B192C;
        }
        .liquid-icon-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(14, 133, 159, 0.22) 100%) !important;
            color: #0E859F;
        }

        /* Menús desplegables flotantes de búsqueda */
        #resultados-busqueda,
        #resultados-busqueda-incluye {
            background-color: rgba(255, 255, 255, 0.96) !important;
            backdrop-filter: blur(8px);
            border: none !important;
            box-shadow: 0 10px 25px -5px rgba(11, 25, 44, 0.15) !important;
        }

        /* Casillas de texto, áreas y selectores sin bordes con matiz ultraligero */
        #main-content input:not([type="file"]),
        #main-content textarea,
        #main-content select {
            background-color: rgba(14, 133, 159, 0.045) !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            color: #0B192C;
            font-weight: 600;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        #main-content input:not([type="file"]):hover,
        #main-content textarea:hover,
        #main-content select:hover {
            background-color: rgba(14, 133, 159, 0.075) !important;
        }
        #main-content input:not([type="file"]):focus,
        #main-content textarea:focus,
        #main-content select:focus {
            background-color: rgba(14, 133, 159, 0.11) !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }
        #main-content select option {
            background-color: #FFFFFF;
            color: #0B192C;
        }
        #main-content input::placeholder,
        #main-content textarea::placeholder {
            color: rgba(11, 25, 44, 0.48);
            font-weight: 500;
        }

        /* Casillas del Login sin bordes */
        #login-container input {
            background-color: rgba(255, 255, 255, 0.06) !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }
        #login-container input:focus {
            background-color: rgba(255, 255, 255, 0.12) !important;
        }

        /* ==========================================
           ESTILOS DE MODO OSCURO (DARK MODE)
           ========================================== */
        body.dark-mode {
            background: radial-gradient(circle at 8% 18%, rgba(237, 129, 60, 0.12) 0%, transparent 42%),
                        radial-gradient(circle at 14% 85%, rgba(14, 133, 159, 0.16) 0%, transparent 48%),
                        #07111E;
            color: #E2E8F0;
        }

        body.dark-mode .az-dropzone {
            background-color: rgba(255, 255, 255, 0.045);
            border-color: rgba(56, 189, 248, 0.35);
        }
        body.dark-mode .az-dropzone:hover {
            background-color: rgba(56, 189, 248, 0.10);
            border-color: #38BDF8;
        }
        body.dark-mode .az-dropzone.drag-over {
            background-color: rgba(14, 133, 159, 0.25);
            border-color: #60A5FA;
        }
        body.dark-mode .az-dropzone.has-file {
            background-color: rgba(16, 185, 129, 0.14);
            border-color: #34D399;
        }

        body.dark-mode .az-empresa-row {
            background-color: rgba(255, 255, 255, 0.035);
        }
        body.dark-mode .az-empresa-row.activa-usfire {
            background-color: rgba(237, 129, 60, 0.15);
            box-shadow: inset 3.5px 0 0 #ED813C;
        }
        body.dark-mode .az-empresa-row.activa-usiicsa {
            background-color: rgba(14, 133, 159, 0.18);
            box-shadow: inset 3.5px 0 0 #38BDF8;
        }

        body.dark-mode #sidebar {
            background: linear-gradient(
                145deg,
                rgba(15, 31, 54, 0.72) 0%,
                rgba(11, 25, 44, 0.58) 45%,
                rgba(14, 133, 159, 0.20) 85%,
                rgba(237, 129, 60, 0.14) 100%
            ) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.14) !important;
            box-shadow:
                inset 1px 1px 1px rgba(255, 255, 255, 0.16),
                inset -1px -1px 1px rgba(14, 133, 159, 0.25),
                12px 0 36px -8px rgba(0, 0, 0, 0.5) !important;
            color: #F8FAFC;
        }

        body.dark-mode .liquid-nav-btn {
            color: #E2E8F0;
        }

            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(14, 133, 159, 0.22) 100%) !important;
